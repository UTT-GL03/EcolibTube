- name: Watch a trending video
  url: http://localhost/trending
  actions:
    - name: Choisir une vidéo
      type: click
      element: main figure:nth-child(4)
      pageChange: true
      waitForSelector: main > figure
    - name: Lancer la vidéo
      type: click
      element: main > video
      waitForSelector: main > video
    - name: Consulter la description et les commentaires
      type: scroll
