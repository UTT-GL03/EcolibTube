- name: Watch a trending
  url: http://localhost/trending
  actions:
    - name: Consulter les vidéos en tendance
      type: scroll
    - name: Choisir une vidéo
      type: click
      element: main:nth-child(4)
      pageChange: true
      waitForSelector: main figcaption
    - name: Lancer la vidéo
      type: click
      element: main > video
      waitForSelector: main > video
    - name: Consulter la description et les commentaires
      type: scroll
