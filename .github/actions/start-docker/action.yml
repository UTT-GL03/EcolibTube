name: Start Docker
description: Build App, Run docker container and wait for the starting

runs:
  using: "composite"
  steps:
    - name: Build App
      shell: bash
      run: |
          cd app
          npm run build
    - name: Start Docker Container
      shell: bash
      run: |
        export COUCHDB_USER="ADMIN"
        export COUCHDB_PASSWORD="ADMIN"
        docker compose up --detach
    - name: Wait for App
      uses: docker://benel/wait-for-response:1
      with:
        args: http://localhost/ 200 30000 500
    - name: Wait for DB
      uses: docker://benel/wait-for-response:1
      with:
        args: http://localhost:5984/ 200 30000 500
