name: Start Docker
description: Build App, Run docker container and wait for the starting

runs:
  using: "composite"
  steps:
    - name: Build App
      shell: bash
      run: |
          cd app
          npm run build
    - name: Start Docker Container
      shell: bash
      run: |
        export COUCHDB_USER="ADMIN"
        export COUCHDB_PASSWORD="ADMIN"
        docker compose up --detach

    - name: Wait for App
      uses: docker://benel/wait-for-response:1
      with:
        args: http://localhost/ 200 30000 500
    - name: Wait for DB
      uses: docker://benel/wait-for-response:1
      with:
        args: http://localhost:5984/ 200 30000 500

    - name: Create DB
      run: |
        alias put="curl -X PUT -u '${COUCHDB_USER}:${COUCHDB_PASSWORD}'"
        put db:5984/:5984/_node/nonode@nohost/_config/chttpd/enable_cors --data '"true"'
        put db:5984/:5984/_node/nonode@nohost/_config/cors/origins --data '"*"'
        put db:5984/:5984/ecolibtube
        put db:5984/ecolibtube/_security --data '{"members":{"roles":[]},"admins":{"roles":["_admin"]}}'
      shell: bash

    - name: Generate sample data
      run: |
        npx --yes dummy-json dummy-data/video_sample.hbs > app/public/dummy-data/videos.json
        npx --yes dummy-json dummy-data/comment_sample.hbs > app/public/dummy-data/comments.json
      shell: bash
    - name: Upload samples
      run: |
        curl -X POST db:5984/ecolibtube/_bulk_docs -H "Content-Type: application/json" -d app/public/dummy-data/videos.json
        curl -X POST db:5984/ecolibtube/_bulk_docs -H "Content-Type: application/json" -d app/public/dummy-data/comments.json
      shell: bash
